# libpq connection defaults applied via PGSERVICE=sdn (see scripts/lib_stack.sh).
# A dead connection (e.g. dropped under CPU/flow flood) must error out in
# seconds instead of blocking forever; explicit connection arguments still win.
[sdn]
keepalives=1
keepalives_idle=10
keepalives_interval=5
keepalives_count=3
tcp_user_timeout=20000
