services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdn_monitor
      POSTGRES_USER: sdn_user
      POSTGRES_PASSWORD: local-lab-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sdn-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdn_user -d sdn_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sdn-postgres-data:
