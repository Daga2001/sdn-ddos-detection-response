# Override for compose.lab.yaml: adds our detection service (LLM + entropy, never
# mixed) and points the lab's runner at it. Use through scripts/lab_detector.sh:
#   docker compose --env-file .env --env-file .lab/env \
#     -f compose.lab.yaml -f compose.detector.yaml up --build -d

services:
  detector:
    build:
      context: .
      dockerfile: containers/detector.Dockerfile
    environment:
      DDOS_API_KEY: ${SDN_LAB_INFERENCE_KEY:?Run make lab-setup}
      SDN_DETECTION_MODE: ${SDN_DETECTION_MODE:-llm}
      SDN_LLM_OLLAMA_URL: ${SDN_LLM_OLLAMA_URL:-http://192.168.83.1:11434}
      SDN_LLM_MODEL: ${SDN_LLM_MODEL:-llama3.2:3b}
      SDN_LLM_PROMPT: ${SDN_LLM_PROMPT:-lab}
      SDN_RESPONSE_POLICY: ${SDN_RESPONSE_POLICY:-block}
      SDN_RESPONSE_DRY_RUN: ${SDN_RESPONSE_DRY_RUN:-true}
      SDN_LLM_TIMEOUT_SECONDS: ${SDN_LLM_TIMEOUT_SECONDS:-20}
      SDN_ENTROPY_K: ${SDN_ENTROPY_K:-2.5}
      SDN_ENTROPY_ALPHA: ${SDN_ENTROPY_ALPHA:-0.2}
      SDN_ENTROPY_WARMUP: ${SDN_ENTROPY_WARMUP:-16}
      SDN_ENTROPY_CONSECUTIVE: ${SDN_ENTROPY_CONSECUTIVE:-2}
      # Lab baseline is only the HTTP probes (~5 packets/s network-wide, measured),
      # so the standalone default of 20 would classify every baseline window idle.
      SDN_ENTROPY_MIN_RATE: ${SDN_ENTROPY_MIN_RATE:-2}
      SDN_ENTROPY_MIN_STD: ${SDN_ENTROPY_MIN_STD:-0.05}
      SDN_ENTROPY_CANDIDATE_SHARE: ${SDN_ENTROPY_CANDIDATE_SHARE:-0.3}
      SDN_ENTROPY_CANDIDATE_MIN_RATE: ${SDN_ENTROPY_CANDIDATE_MIN_RATE:-20}
      # Baseline protection (see docs/detection-modes.md): 0 / empty keep the original behaviour.
      SDN_ENTROPY_UPDATE_HOLD: ${SDN_ENTROPY_UPDATE_HOLD:-0}
      SDN_ENTROPY_ALPHA_RUN: ${SDN_ENTROPY_ALPHA_RUN:-}
      # Which entropy and how the band is learned (docs/detection-modes.md); the lab
      # overrides these per run from the Detection tab.
      SDN_ENTROPY_MEASURE: ${SDN_ENTROPY_MEASURE:-shannon}
      SDN_ENTROPY_ORDER: ${SDN_ENTROPY_ORDER:-2}
      SDN_ENTROPY_CENTER: ${SDN_ENTROPY_CENTER:-ewma}
      SDN_ENTROPY_SPREAD: ${SDN_ENTROPY_SPREAD:-std}
      SDN_ENTROPY_HISTORY: ${SDN_ENTROPY_HISTORY:-0}
      SDN_ENTROPY_CONTEXT: ${SDN_ENTROPY_CONTEXT:-normal}
    # `control` is internal (no internet); `egress` lets the LLM backend (Ollama
    # on the Windows host) be reached.
    networks: [control, egress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 4s
      retries: 6
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true

  runner:
    environment:
      SDN_DDOS_SERVICE_URL: http://detector:8000/predict
      SDN_RYU_MANAGER: /usr/local/bin/ryu-modes
      SDN_DETECTION_MODE: ${SDN_DETECTION_MODE:-llm}
      SDN_LLM_HTTP_TIMEOUT: ${SDN_LLM_HTTP_TIMEOUT:-30}
      SDN_LLM_MAX_SAMPLES: ${SDN_LLM_MAX_SAMPLES:-5}
      SDN_LLM_ASYNC: ${SDN_LLM_ASYNC:-true}
      SDN_MAX_FLOW_ROWS_PER_POLL: ${SDN_MAX_FLOW_ROWS_PER_POLL:-300}
      SDN_ENTROPY_WINDOW_SECONDS: ${SDN_ENTROPY_WINDOW_SECONDS:-5}
      SDN_ENTROPY_WINDOW_MODE: ${SDN_ENTROPY_WINDOW_MODE:-mean}
      SDN_ENTROPY_DEDUPE_SWITCHES: ${SDN_ENTROPY_DEDUPE_SWITCHES:-false}
      # Research: append every entropy window (flows and histograms) to this file
      # inside the runner container, to replay detector variants offline.
      SDN_ENTROPY_DUMP: ${SDN_ENTROPY_DUMP:-}
      # Response policy (only acts when the run has mitigation enabled).
      SDN_RESPONSE_POLICY: ${SDN_RESPONSE_POLICY:-block}
      SDN_RESPONSE_DRY_RUN: ${SDN_RESPONSE_DRY_RUN:-true}
      SDN_RATE_LIMIT_PPS: ${SDN_RATE_LIMIT_PPS:-50}
      SDN_RATE_LIMIT_BURST: ${SDN_RATE_LIMIT_BURST:-100}
      SDN_RATE_LIMIT_SECONDS: ${SDN_RATE_LIMIT_SECONDS:-120}
      SDN_RESPONSE_ESCALATE_AFTER: ${SDN_RESPONSE_ESCALATE_AFTER:-20}
      SDN_RESPONSE_PROTECTED: ${SDN_RESPONSE_PROTECTED:-}
      SDN_RESPONSE_MAX_ACTIVE: ${SDN_RESPONSE_MAX_ACTIVE:-16}
      SDN_RESPONSE_CONFIRM_HITS: ${SDN_RESPONSE_CONFIRM_HITS:-1}
      SDN_RESPONSE_CONFIRM_SECONDS: ${SDN_RESPONSE_CONFIRM_SECONDS:-30}
    volumes:
      - ./containers/ryu-modes.sh:/usr/local/bin/ryu-modes:ro
    depends_on: [detector]

networks:
  egress: {}
